name: Refresh profile charts

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/profile-summary-cards.yml
      - scripts/read_summary_cards.py
      - scripts/render_profile.py

concurrency:
  group: profile-charts
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate source statistics
        uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_SECRET }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          THEME: github
          UTC_OFFSET: 0
      - name: Render the profile dashboard
        run: python3 scripts/render_profile.py
      - name: Publish the refreshed charts
        run: |
          git add -- assets/profile-dashboard-*.svg profile-summary-card-output/github/[0-4]-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile charts'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
